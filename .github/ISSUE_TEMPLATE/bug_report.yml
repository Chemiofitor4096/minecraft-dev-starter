name: Bug report
description: Detection, launch, logs or the panel behaved wrongly
title: '[bug] '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        The first four fields decide whether this is reproducible at all. If a field does not apply,
        write `n/a` rather than leaving it empty.
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      description: The `host ready (x.y.z)` line in the DSH host log, or the version on the npm page.
      placeholder: '0.1.10'
    validations:
      required: true
  - type: input
    id: host-version
    attributes:
      label: Host version
      description: DSH NEXT version (Settings → About), or `dsh --version` for the CLI.
      placeholder: 'DSH NEXT 2.0.21-next (dsh 0.2.1-rc.4)'
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS and Node
      placeholder: 'Windows 11 10.0.26200, Node 24.22.1'
    validations:
      required: true
  - type: dropdown
    id: project
    attributes:
      label: Project shape
      options:
        - Fabric (single module)
        - Fabric (multi-module / composite)
        - Forge
        - NeoForge
        - Architectury
        - Paper / Spigot
        - Other / not a Minecraft project
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, what you got. Screenshots are welcome.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        The Mod Dev panel shows the log path; paste the last ~50 lines of that file, or the host log
        lines starting with `[mcdev]`. Redact home directory paths before pasting.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I rebuilt the client after pulling (`npm run build`) if this is a local checkout
        - label: I checked the Known limitations section of the README
