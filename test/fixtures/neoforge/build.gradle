plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = mod_version
group = mod_group_id

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
        }
        server {
            server()
        }
        data {
            data()
        }
        gameTestServer {
            type = "gameTestServer"
        }
    }
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)
